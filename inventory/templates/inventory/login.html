{% extends "inventory/base.html" %}

{% block content %}
<div style="max-width: 340px; margin: 60px auto; background: white;
            padding: 24px; border-radius: 8px;">
    <h2>Sign in</h2>

    {% if form.errors %}
        <p style="color: #b3261e;">Wrong username or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                style="background:#0d5f63; color:white; border:0;
                       padding:8px 18px; border-radius:4px; cursor:pointer;">
            Sign in
        </button>
    </form>
</div>
{% endblock %}
